version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: esportify_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: esportify
      MYSQL_USER: esportify_user
      MYSQL_PASSWORD: esportify_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql

  app:
    build: .
    container_name: esportify_app
    restart: always
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/esportify?useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: esportify_user
      SPRING_DATASOURCE_PASSWORD: esportify_pass
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      - db
    ports:
      - "8080:8080"
    command: mvn clean package -DskipTests && java -jar /app.jar

volumes:
  db_data:
