<!DOCTYPE html>
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
  <title>Mon compte</title>
</head>
<body>
<section layout:fragment="content" class="container my-5">
  <h2 class="text-center">Mon compte</h2>

  <!-- Boutons de navigation -->
  <div class="btn-group d-flex justify-content-center mb-3">
    <button class="btn btn-primary" id ="profile-section-btn">Modifier mon profil</button>
    <button class="btn btn-success" id ="events-section-btn">Mes événements</button>
    <button class="btn btn-warning" id ="organizer-section-btn">Devenir organisateur</button>
  </div>

  <!-- Modifier mon profil -->
  <div id="profile-section">
    <h3>Modifier mon profil</h3>
    <form id="profileForm">
      <div class="mb-3">
        <label for="pseudo" class="form-label">Pseudo</label>
        <input type="text" id="pseudo" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input type="email" id="email" class="form-control" readonly>
      </div>
      <div class="mb-3">
        <label for="newPassword" class="form-label">Nouveau mot de passe</label>
        <input type="password" id="newPassword" class="form-control">
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirmer le mot de passe</label>
        <input type="password" id="confirmPassword" class="form-control">
      </div>
      <button type="submit" class="btn btn-primary">Mettre à jour</button>
    </form>
  </div>

  <!-- Mes événements -->
  <div id="events-section" style="display:none;">
    <h3>Mes événements</h3>
    <table class="table">
      <thead>
      <tr>
        <th>Événement</th>
        <th>Date</th>
        <th>Statut</th>
      </tr>
      </thead>
      <tbody id="eventsTable">
      <!-- Les événements seront chargés via JavaScript -->
      </tbody>
    </table>
  </div>

  <!-- Demande organisateur -->
  <div id="organizer-section" style="display:none;">
    <h3>Devenir organisateur</h3>
    <p>Vous souhaitez organiser des événements ? Envoyez une demande :</p>
    <button id="requestOrganizer" class="btn btn-warning">Faire une demande</button>
  </div>

</section>

<!-- Charger le script pour gérer l'affichage dynamique -->
<script type="module" th:src="@{/js/user/account.js}"></script>
</body>
</html>
