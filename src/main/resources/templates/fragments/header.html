<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head></head>
<body>
<header th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">Esportify</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/" th:href="@{/}">Accueil</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" th:href="@{/events}">Événements</a></li>
                    <li class="nav-item"><a class="nav-link" href="#" th:href="@{/contact}">Contact</a></li>
                    <li th:if="${isOrganizer}" class="nav-item"><a class="nav-link" href="#" th:href="@{/organizer}">Organisateur</a></li>
                    <li th:if="${isAdmin}" class="nav-item"><a class="nav-link" href="#" th:href="@{/admin}">Admin</a></li>
                    <li th:if="${isAuthenticated}" class="nav-item"><a class="nav-link" href="#" th:href="@{/account}">Mon Compte</a></li>
                    <li th:if="${!isAuthenticated}" class="nav-item"><a class="nav-link" href="#" th:href="@{/auth}">Connexion</a></li>
                    <li th:if="${isAuthenticated}" class="nav-item"><a class="nav-link" href="#" id="logout">Déconnexion</a></li>
                </ul>
            </div>
        </div>
    </nav>
</header>
</body>
</html>
