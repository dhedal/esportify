<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8">
    <title>Liste des événements</title>
</head>
<body>

<section layout:fragment="content" class="container my-5">
    <div class="row">
        <!-- Menu latéral pour les filtres -->
        <nav class="col-md-3 col-lg-2 bg-light p-3">
            <h4 class="text-center">Filtres</h4>

            <!-- Recherche par titre -->
            <input type="text" id="searchEventInput" class="form-control mb-3" placeholder="Rechercher par titre...">

            <!-- Filtrer par nombre de joueurs -->
            <label class="fw-bold">Nombre de joueurs :</label>
            <select id="filterPlayers" class="form-select mb-3">
                <option value="">Tous</option>
                <option value="10">Moins de 10</option>
                <option value="50">Moins de 50</option>
                <option value="100">Moins de 100</option>
                <option value="100+">100 et plus</option>
            </select>

            <!-- Filtrer par date -->
            <label class="fw-bold">Date de l'événement :</label>
            <input type="date" id="filterDate" class="form-control mb-3">

            <!-- Filtrer par organisateur -->
            <label class="fw-bold">Organisateur :</label>
            <div class="position-relative">
                <input type="text" id="filterOrganizer" class="form-control mb-3" placeholder="Nom de l'organisateur" list="organizerList">
                <datalist id="organizerList"></datalist>
                <div id="organizerDropdown" class="dropdown-menu w-100" style="display: none; max-height: 200px; overflow-y: auto;"></div>
            </div>
            <!-- Bouton rechercher -->
            <button id="searchEventBtn" class="btn btn-primary w-100">Rechercher</button>
        </nav>

        <!-- Contenu principal -->
        <main class="col-md-9 col-lg-10 p-4">
            <h2 class="text-center">Événements disponibles</h2>

            <!-- Tableau des événements -->
            <table class="table table-striped">
                <thead>
                <tr>
                    <th>Titre</th>
                    <th>Date</th>
                    <th>Organisateur</th>
                    <th>Participants</th>
                    <th>Status</th>
                    <th>Voir plus</th>
                </tr>
                </thead>
                <tbody id="eventsTable">
                <!-- Les événements seront insérés dynamiquement ici -->
                </tbody>
            </table>

            <!-- Pagination -->
            <nav>
                <ul class="pagination justify-content-center" id="eventsPagination"></ul>
            </nav>
        </main>
    </div>
</section>

</body>
</html>
