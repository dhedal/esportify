spring.application.name=esportify

server.port=9090

spring.datasource.url=${ES_DB_URL}?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${ES_DB_USER}
spring.datasource.password=${ES_DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Autres configurations facultatives
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false


pring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/static/**

# Désactiver le cache pour les fichiers statiques (utile en d�veloppement)
spring.web.resources.cache.period=0
spring.web.resources.chain.cache=false
spring.web.resources.chain.strategy.content.enabled=true


# Activer les logs en mode DEBUG
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
