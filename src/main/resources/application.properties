spring.application.name=esportify

spring.datasource.url=jdbc:mysql://localhost:3306/esportify
spring.datasource.username=root
spring.datasource.password=root


server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Autres configurations facultatives
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.cache=false

#spring.web.resources.static-locations=classpath:/static/
#spring.mvc.static-path-pattern=/static/**

# Désactiver le cache pour les fichiers statiques (utile en développement)
#spring.web.resources.cache.period=0
#spring.web.resources.chain.cache=false
#spring.web.resources.chain.strategy.content.enabled=true

spring.security.user.name=admin
spring.security.user.password=secret

# Activer les logs en mode DEBUG
logging.level.root=INFO
logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=INFO
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
